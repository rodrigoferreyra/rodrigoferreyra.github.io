name: Deploy to GitHub Pages

# The workflow is triggered on pushes to the main branch, and you can also run it manually.
on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Sets the permissions needed for deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# This ensures only one deployment runs at a time.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # ⚠️ IMPORTANT: Replace '20' with your local Node.js major version
          node-version: "22.20.0"
          cache: 'npm' # This caches dependencies for faster builds

      - name: Install dependencies
        run: npm ci # 'ci' is used for a clean, reproducible install

      - name: Build your project
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # ⚠️ IMPORTANT: This path must be your project's output folder.
          # Common names are 'dist', 'build', 'public'.
          path: './dist'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
